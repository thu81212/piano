<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #888;
            font-family: Arial, sans-serif;
        }

        .piano {
            display: flex;
            position: relative;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .white-key {
            width: 100px;
            height: 400px;
            background: white;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 12px;
            color: #999;
            text-decoration: none;
        }

        .white-key:hover {
            background: #f0f0f0;
        }

        .white-key:active {
            background: #e0e0e0;
            transform: translateY(2px);
        }

        .black-key {
            width: 70px;
            height: 250px;
            background: linear-gradient(to bottom, #000 0%, #333 100%);
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 2;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 10px;
            color: #666;
        }

        .black-key:hover {
            background: linear-gradient(to bottom, #222 0%, #444 100%);
        }

        .black-key:active {
            background: linear-gradient(to bottom, #111 0%, #222 100%);
            transform: translateY(2px);
        }

        /* Position black keys */
        .black-key:nth-of-type(1) { left: 65px; }  /* C# between C and D */
        .black-key:nth-of-type(2) { left: 165px; } /* D# between D and E */
        .black-key:nth-of-type(3) { left: 365px; } /* F# between F and G */
        .black-key:nth-of-type(4) { left: 465px; } /* G# between G and A */
        .black-key:nth-of-type(5) { left: 565px; } /* A# between A and B */

        .active {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="piano">
        <!-- Black keys (must come first for z-index) -->
        <a href="c-sharp-4.html" class="black-key" data-note="C#4"></a>
        <a href="d-sharp-4.html" class="black-key" data-note="D#4"></a>
        <a href="f-sharp-4.html" class="black-key" data-note="F#4"></a>
        <a href="g-sharp-4.html" class="black-key" data-note="G#4"></a>
        <a href="a-sharp-4.html" class="black-key" data-note="A#4"></a>

        <!-- White keys -->
        <a href="c4.html" class="white-key" data-note="C4"></a>
        <a href="d4.html" class="white-key" data-note="D4"></a>
        <a href="e4.html" class="white-key" data-note="E4"></a>
        <a href="f4.html" class="white-key" data-note="F4"></a>
        <a href="g4.html" class="white-key" data-note="G4"></a>
        <a href="a4.html" class="white-key" data-note="A4"></a>
        <a href="b4.html" class="white-key" data-note="B4"></a>
        <a href="c5.html" class="white-key" data-note="C5"></a>
    </div>
</body>
</html>
