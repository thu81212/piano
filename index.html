<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Piano</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .instructions {
            color: white;
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .instructions p {
            margin: 5px 0;
        }

        .piano-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .piano {
            display: flex;
            position: relative;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .white-key {
            width: 100px;
            height: 400px;
            background: white;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            gap: 5px;
            text-decoration: none;
        }

        .white-key .note-name {
            font-size: 14px;
            color: #999;
            font-weight: bold;
        }

        .white-key .key-hint {
            font-size: 11px;
            color: #ccc;
            background: rgba(0,0,0,0.1);
            padding: 3px 8px;
            border-radius: 3px;
        }

        .white-key:hover {
            background: #f0f0f0;
        }

        .white-key.active {
            background: #ffd700;
            transform: translateY(2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .black-key {
            width: 70px;
            height: 250px;
            background: linear-gradient(to bottom, #000 0%, #333 100%);
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 2;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
            gap: 3px;
            text-decoration: none;
        }

        .black-key .note-name {
            font-size: 12px;
            color: #999;
            font-weight: bold;
        }

        .black-key .key-hint {
            font-size: 10px;
            color: #aaa;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .black-key:hover {
            background: linear-gradient(to bottom, #222 0%, #444 100%);
        }

        .black-key.active {
            background: linear-gradient(to bottom, #444 0%, #666 100%);
            transform: translateY(2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        /* Position black keys */
        .black-key:nth-of-type(1) { left: 65px; }  /* C# between C and D */
        .black-key:nth-of-type(2) { left: 165px; } /* D# between D and E */
        .black-key:nth-of-type(3) { left: 365px; } /* F# between F and G */
        .black-key:nth-of-type(4) { left: 465px; } /* G# between G and A */
        .black-key:nth-of-type(5) { left: 565px; } /* A# between A and B */
    </style>
</head>
<body>
    <h1>Mechanic Piano</h1>

    <div class="instructions">
        <p>Click on piano keys or use your keyboard to play!</p>
        <p>Keys: A S D F G H J K L (white keys) | W E T Y U (black keys)</p>
    </div>

    <div class="piano-container">
        <div class="piano">
            <!-- Black keys (must come first for z-index) -->
            <div class="black-key" data-note="C#4" data-freq="277.18" data-key="W">
                <span class="note-name">C#</span>
                <span class="key-hint">W</span>
            </div>
            <div class="black-key" data-note="D#4" data-freq="311.13" data-key="E">
                <span class="note-name">D#</span>
                <span class="key-hint">E</span>
            </div>
            <div class="black-key" data-note="F#4" data-freq="369.99" data-key="T">
                <span class="note-name">F#</span>
                <span class="key-hint">T</span>
            </div>
            <div class="black-key" data-note="G#4" data-freq="415.30" data-key="Y">
                <span class="note-name">G#</span>
                <span class="key-hint">Y</span>
            </div>
            <div class="black-key" data-note="A#4" data-freq="466.16" data-key="U">
                <span class="note-name">A#</span>
                <span class="key-hint">U</span>
            </div>

            <!-- White keys -->
            <div class="white-key" data-note="C4" data-freq="261.63" data-key="A">
                <span class="note-name">C</span>
                <span class="key-hint">A</span>
            </div>
            <div class="white-key" data-note="D4" data-freq="293.66" data-key="S">
                <span class="note-name">D</span>
                <span class="key-hint">S</span>
            </div>
            <div class="white-key" data-note="E4" data-freq="329.63" data-key="D">
                <span class="note-name">E</span>
                <span class="key-hint">D</span>
            </div>
            <div class="white-key" data-note="F4" data-freq="349.23" data-key="F">
                <span class="note-name">F</span>
                <span class="key-hint">F</span>
            </div>
            <div class="white-key" data-note="G4" data-freq="392.00" data-key="G">
                <span class="note-name">G</span>
                <span class="key-hint">G</span>
            </div>
            <div class="white-key" data-note="A4" data-freq="440.00" data-key="H">
                <span class="note-name">A</span>
                <span class="key-hint">H</span>
            </div>
            <div class="white-key" data-note="B4" data-freq="493.88" data-key="J">
                <span class="note-name">B</span>
                <span class="key-hint">J</span>
            </div>
            <div class="white-key" data-note="C5" data-freq="523.25" data-key="K">
                <span class="note-name">C</span>
                <span class="key-hint">K</span>
            </div>
        </div>
    </div>

    <script>
        // Create Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Function to play a note
        function playNote(frequency, duration = 0.5) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = 'sine'; // Piano-like sound

            // Add envelope for more natural sound
            const now = audioContext.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + duration); // Decay

            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        // Function to activate key visually
        function activateKey(key) {
            key.classList.add('active');
            setTimeout(() => {
                key.classList.remove('active');
            }, 200);
        }

        // Handle mouse clicks on keys
        document.querySelectorAll('.white-key, .black-key').forEach(key => {
            key.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const frequency = parseFloat(key.dataset.freq);
                playNote(frequency);
                activateKey(key);
            });
        });

        // Handle keyboard input
        const keyMap = {};
        document.querySelectorAll('.white-key, .black-key').forEach(key => {
            const keyboardKey = key.dataset.key.toLowerCase();
            keyMap[keyboardKey] = key;
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keyMap[key] && !e.repeat) {
                const pianoKey = keyMap[key];
                const frequency = parseFloat(pianoKey.dataset.freq);
                playNote(frequency);
                activateKey(pianoKey);
            }
        });

        // Resume audio context on user interaction (required by some browsers)
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
