<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #888;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #camera-container {
            position: relative;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #video {
            display: none;
        }

        #canvas {
            display: block;
            border-radius: 10px;
            max-width: 640px;
            width: 100%;
        }

        .piano {
            display: flex;
            position: relative;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .white-key {
            width: 100px;
            height: 400px;
            background: white;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 12px;
            color: #999;
        }

        .white-key:hover {
            background: #f0f0f0;
        }

        .white-key:active {
            background: #e0e0e0;
            transform: translateY(2px);
        }

        .black-key {
            width: 70px;
            height: 250px;
            background: linear-gradient(to bottom, #000 0%, #333 100%);
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 2;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 10px;
            color: #666;
        }

        .black-key:hover {
            background: linear-gradient(to bottom, #222 0%, #444 100%);
        }

        .black-key:active {
            background: linear-gradient(to bottom, #111 0%, #222 100%);
            transform: translateY(2px);
        }

        /* Position black keys */
        .black-key:nth-of-type(1) { left: 65px; }  /* C# between C and D */
        .black-key:nth-of-type(2) { left: 165px; } /* D# between D and E */
        .black-key:nth-of-type(3) { left: 365px; } /* F# between F and G */
        .black-key:nth-of-type(4) { left: 465px; } /* G# between G and A */
        .black-key:nth-of-type(5) { left: 565px; } /* A# between A and B */

        .active {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        #status {
            color: white;
            margin-bottom: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="status">Initializing camera...</div>

    <div id="camera-container">
        <video id="video" width="640" height="480" autoplay></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <div class="piano">
        <!-- Black keys (must come first for z-index) -->
        <div class="black-key" data-note="C#4"></div>
        <div class="black-key" data-note="D#4"></div>
        <div class="black-key" data-note="F#4"></div>
        <div class="black-key" data-note="G#4"></div>
        <div class="black-key" data-note="A#4"></div>

        <!-- White keys -->
        <div class="white-key" data-note="C4"></div>
        <div class="white-key" data-note="D4"></div>
        <div class="white-key" data-note="E4"></div>
        <div class="white-key" data-note="F4"></div>
        <div class="white-key" data-note="G4"></div>
        <div class="white-key" data-note="A4"></div>
        <div class="white-key" data-note="B4"></div>
        <div class="white-key" data-note="C5"></div>
    </div>

    <script>
        // Create audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Note frequencies (in Hz)
        const noteFrequencies = {
            'C4': 261.63,
            'C#4': 277.18,
            'D4': 293.66,
            'D#4': 311.13,
            'E4': 329.63,
            'F4': 349.23,
            'F#4': 369.99,
            'G4': 392.00,
            'G#4': 415.30,
            'A4': 440.00,
            'A#4': 466.16,
            'B4': 493.88,
            'C5': 523.25
        };

        // Track which keys are currently playing to avoid repeats
        const activeNotes = new Set();

        // Function to play a note
        function playNote(frequency, duration = 0.5) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // Function to activate a key
        function activateKey(note) {
            if (!activeNotes.has(note)) {
                activeNotes.add(note);
                const frequency = noteFrequencies[note];
                playNote(frequency);
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    keyElement.classList.add('active');
                }
            }
        }

        // Function to deactivate a key
        function deactivateKey(note) {
            activeNotes.delete(note);
            const keyElement = document.querySelector(`[data-note="${note}"]`);
            if (keyElement) {
                keyElement.classList.remove('active');
            }
        }

        // Add click event listeners to all keys
        const keys = document.querySelectorAll('.white-key, .black-key');
        keys.forEach(key => {
            key.addEventListener('mousedown', function() {
                const note = this.getAttribute('data-note');
                activateKey(note);
            });

            key.addEventListener('mouseup', function() {
                const note = this.getAttribute('data-note');
                deactivateKey(note);
            });

            key.addEventListener('mouseleave', function() {
                const note = this.getAttribute('data-note');
                deactivateKey(note);
            });
        });

        // Keyboard support
        const keyMap = {
            'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
            'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
            'u': 'A#4', 'j': 'B4', 'k': 'C5'
        };

        document.addEventListener('keydown', function(e) {
            const note = keyMap[e.key.toLowerCase()];
            if (note && noteFrequencies[note]) {
                activateKey(note);
            }
        });

        document.addEventListener('keyup', function(e) {
            const note = keyMap[e.key.toLowerCase()];
            if (note) {
                deactivateKey(note);
            }
        });

        // MediaPipe Hands Setup
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');

        // Map screen position to piano key
        function getKeyAtPosition(x, y) {
            const pianoElement = document.querySelector('.piano');
            const pianoRect = pianoElement.getBoundingClientRect();

            // Check if position is within piano bounds
            if (y < pianoRect.top || y > pianoRect.bottom ||
                x < pianoRect.left || x > pianoRect.right) {
                return null;
            }

            // Check black keys first (they're on top)
            const blackKeys = document.querySelectorAll('.black-key');
            for (let key of blackKeys) {
                const rect = key.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right &&
                    y >= rect.top && y <= rect.bottom) {
                    return key.getAttribute('data-note');
                }
            }

            // Then check white keys
            const whiteKeys = document.querySelectorAll('.white-key');
            for (let key of whiteKeys) {
                const rect = key.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right &&
                    y >= rect.top && y <= rect.bottom) {
                    return key.getAttribute('data-note');
                }
            }

            return null;
        }

        // Track hand positions
        let lastTriggeredKeys = new Set();

        function onResults(results) {
            // Clear canvas
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw video feed
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusElement.textContent = `Hands detected: ${results.multiHandLandmarks.length}`;

                const currentTriggeredKeys = new Set();

                for (const landmarks of results.multiHandLandmarks) {
                    // Draw hand landmarks
                    drawConnectors(canvasCtx, landmarks, HANDS_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

                    // Check index finger tip (landmark 8)
                    const indexTip = landmarks[8];

                    // Convert normalized coordinates to screen coordinates
                    const x = indexTip.x * canvasElement.width;
                    const y = indexTip.y * canvasElement.height;

                    // Convert canvas coordinates to page coordinates
                    const canvasRect = canvasElement.getBoundingClientRect();
                    const screenX = canvasRect.left + x;
                    const screenY = canvasRect.top + y;

                    // Check if finger is over a piano key
                    const note = getKeyAtPosition(screenX, screenY);
                    if (note) {
                        currentTriggeredKeys.add(note);

                        // Draw indicator on canvas
                        canvasCtx.beginPath();
                        canvasCtx.arc(x, y, 15, 0, 2 * Math.PI);
                        canvasCtx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = '#FFD700';
                        canvasCtx.lineWidth = 3;
                        canvasCtx.stroke();
                    }
                }

                // Activate new keys
                for (let note of currentTriggeredKeys) {
                    if (!lastTriggeredKeys.has(note)) {
                        activateKey(note);
                    }
                }

                // Deactivate keys no longer triggered
                for (let note of lastTriggeredKeys) {
                    if (!currentTriggeredKeys.has(note)) {
                        deactivateKey(note);
                    }
                }

                lastTriggeredKeys = currentTriggeredKeys;
            } else {
                statusElement.textContent = 'No hands detected - move your hands in front of the camera';

                // Deactivate all hand-triggered keys
                for (let note of lastTriggeredKeys) {
                    deactivateKey(note);
                }
                lastTriggeredKeys.clear();
            }

            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Initialize camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start().then(() => {
            statusElement.textContent = 'Camera ready - move your index finger over piano keys to play!';
        }).catch((error) => {
            statusElement.textContent = 'Camera access denied or not available';
            console.error('Camera error:', error);
        });
    </script>
</body>
</html>
