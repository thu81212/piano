<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #888;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .piano {
            display: flex;
            position: relative;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .white-key {
            width: 60px;
            height: 250px;
            background: white;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 12px;
            color: #999;
        }

        .white-key:hover {
            background: #f0f0f0;
        }

        .white-key:active {
            background: #e0e0e0;
            transform: translateY(2px);
        }

        .black-key {
            width: 40px;
            height: 150px;
            background: linear-gradient(to bottom, #000 0%, #333 100%);
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 2;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 10px;
            color: #666;
        }

        .black-key:hover {
            background: linear-gradient(to bottom, #222 0%, #444 100%);
        }

        .black-key:active {
            background: linear-gradient(to bottom, #111 0%, #222 100%);
            transform: translateY(2px);
        }

        /* Position black keys */
        .black-key:nth-of-type(1) { left: 60px; }
        .black-key:nth-of-type(2) { left: 122px; }
        .black-key:nth-of-type(3) { left: 246px; }
        .black-key:nth-of-type(4) { left: 308px; }
        .black-key:nth-of-type(5) { left: 370px; }
        .black-key:nth-of-type(6) { left: 494px; }
        .black-key:nth-of-type(7) { left: 556px; }

        .active {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>
    <h1>Piano</h1>

    <div class="piano">
        <!-- Black keys (must come first for z-index) -->
        <div class="black-key" data-note="C#4">C#</div>
        <div class="black-key" data-note="D#4">D#</div>
        <div class="black-key" data-note="F#4">F#</div>
        <div class="black-key" data-note="G#4">G#</div>
        <div class="black-key" data-note="A#4">A#</div>
        <div class="black-key" data-note="C#5">C#</div>
        <div class="black-key" data-note="D#5">D#</div>

        <!-- White keys -->
        <div class="white-key" data-note="C4">C</div>
        <div class="white-key" data-note="D4">D</div>
        <div class="white-key" data-note="E4">E</div>
        <div class="white-key" data-note="F4">F</div>
        <div class="white-key" data-note="G4">G</div>
        <div class="white-key" data-note="A4">A</div>
        <div class="white-key" data-note="B4">B</div>
        <div class="white-key" data-note="C5">C</div>
    </div>

    <script>
        // Create audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Note frequencies (in Hz)
        const noteFrequencies = {
            'C4': 261.63,
            'C#4': 277.18,
            'D4': 293.66,
            'D#4': 311.13,
            'E4': 329.63,
            'F4': 349.23,
            'F#4': 369.99,
            'G4': 392.00,
            'G#4': 415.30,
            'A4': 440.00,
            'A#4': 466.16,
            'B4': 493.88,
            'C5': 523.25,
            'C#5': 554.37,
            'D#5': 622.25
        };

        // Function to play a note
        function playNote(frequency, duration = 0.5) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // Add click event listeners to all keys
        const keys = document.querySelectorAll('.white-key, .black-key');
        keys.forEach(key => {
            key.addEventListener('mousedown', function() {
                const note = this.getAttribute('data-note');
                const frequency = noteFrequencies[note];
                playNote(frequency);
                this.classList.add('active');
            });

            key.addEventListener('mouseup', function() {
                this.classList.remove('active');
            });

            key.addEventListener('mouseleave', function() {
                this.classList.remove('active');
            });
        });

        // Keyboard support
        const keyMap = {
            'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4',
            'f': 'F4', 't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4',
            'u': 'A#4', 'j': 'B4', 'k': 'C5', 'o': 'C#5', 'l': 'D#5'
        };

        document.addEventListener('keydown', function(e) {
            const note = keyMap[e.key.toLowerCase()];
            if (note && noteFrequencies[note]) {
                const frequency = noteFrequencies[note];
                playNote(frequency);

                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    keyElement.classList.add('active');
                }
            }
        });

        document.addEventListener('keyup', function(e) {
            const note = keyMap[e.key.toLowerCase()];
            if (note) {
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    keyElement.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
