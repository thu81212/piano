<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C5 - Music Archive</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            background: #888;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 30px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 4em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .music-content {
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .music-content h2 {
            margin-top: 0;
        }

        .music-list {
            list-style: none;
            padding: 0;
        }

        .music-list li {
            padding: 15px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Piano</a>

        <h1>C5</h1>

        <div class="music-content">
            <h2>Music Archive</h2>
            <p>Music pieces and songs featuring the C5 note.</p>

            <ul class="music-list">
                <li>Add your music content here</li>
                <li>Songs, recordings, or compositions</li>
                <li>Related to the C5 note</li>
            </ul>
        </div>
    </div>
</body>
</html>
